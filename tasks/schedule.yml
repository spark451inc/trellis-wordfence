---
# Hosts provisioned with 1.x scheduled root cron jobs guarded by lock files
# (a shared scan.lock in 1.0.0, one per scan type from 1.0.1).
# Remove these two cleanup tasks in 3.0.0.
- name: Remove legacy Wordfence cron jobs
  ansible.builtin.cron:
    name: "{{ item }}"
    user: root
    state: absent
  loop:
    - Wordfence CLI malware scan
    - Wordfence CLI vulnerability scan

- name: Remove legacy Wordfence lock files
  ansible.builtin.file:
    path: "/var/cache/wordfence/{{ item }}"
    state: absent
  loop:
    - scan.lock
    - malware-scan.lock
    - vuln-scan.lock

- name: Install Wordfence scan services
  ansible.builtin.template:
    src: wordfence-scan.service.j2
    dest: "/etc/systemd/system/{{ scan.unit }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wordfence_scans }}"
  loop_control:
    loop_var: scan
    label: "{{ scan.unit }}"
  notify: Reload systemd and restart Wordfence scan timers

- name: Install Wordfence scan timers
  ansible.builtin.template:
    src: wordfence-scan.timer.j2
    dest: "/etc/systemd/system/{{ scan.unit }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ wordfence_scans }}"
  loop_control:
    loop_var: scan
    label: "{{ scan.unit }}"
  notify: Reload systemd and restart Wordfence scan timers

- name: Apply Wordfence systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable or disable Wordfence scan timers
  ansible.builtin.systemd:
    name: "{{ scan.unit }}.timer"
    enabled: "{{ scan.enabled | bool }}"
    state: "{{ (scan.enabled | bool) | ternary('started', 'stopped') }}"
  loop: "{{ wordfence_scans }}"
  loop_control:
    loop_var: scan
    label: "{{ scan.unit }}"
