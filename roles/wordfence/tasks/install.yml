---
- name: Check installed Wordfence CLI version
  command: "{{ wordfence_bin }} version"
  register: wordfence_installed
  changed_when: false
  failed_when: false

- name: Install Wordfence CLI binary
  when: >
    wordfence_installed.rc != 0 or
    wordfence_version not in wordfence_installed.stdout
  block:
    - name: Set CPU architecture for download
      set_fact:
        _wordfence_arch: >-
          {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}

    - name: Download Wordfence CLI tarball
      get_url:
        url: >-
          https://github.com/wordfence/wordfence-cli/releases/download/v{{
          wordfence_version }}/wordfence_{{ _wordfence_arch }}.tar.gz
        dest: "/tmp/wordfence_{{ _wordfence_arch }}.tar.gz"
        mode: "0600"

    - name: Extract Wordfence CLI binary to /usr/local/bin
      unarchive:
        src: "/tmp/wordfence_{{ _wordfence_arch }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true

    - name: Ensure Wordfence CLI binary is executable
      file:
        path: "{{ wordfence_bin }}"
        mode: "0755"
        owner: root
        group: root

    - name: Remove downloaded tarball
      file:
        path: "/tmp/wordfence_{{ _wordfence_arch }}.tar.gz"
        state: absent

- name: Verify Wordfence CLI installation
  command: "{{ wordfence_bin }} version"
  changed_when: false
  register: wordfence_version_check

- name: Show installed Wordfence CLI version
  debug:
    msg: "{{ wordfence_version_check.stdout }}"
