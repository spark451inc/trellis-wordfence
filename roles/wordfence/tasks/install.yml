---
- name: Ensure Python 3 and pip are installed
  apt:
    name:
      - python3
      - python3-pip
    state: present
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"

- name: Install Wordfence CLI via pip
  pip:
    name: "wordfence=={{ wordfence_version }}"
    state: present
    executable: pip3

- name: Verify Wordfence CLI installation
  command: "{{ wordfence_bin }} version"
  changed_when: false
  register: wordfence_version_check

- name: Show installed Wordfence CLI version
  debug:
    msg: "{{ wordfence_version_check.stdout }}"
