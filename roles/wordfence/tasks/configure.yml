---
- name: Ensure Wordfence CLI configuration directory exists
  file:
    path: "{{ wordfence_config_dir }}"
    state: directory
    owner: "{{ wordfence_user }}"
    group: "{{ wordfence_user }}"
    mode: '0750'

- name: Ensure Wordfence CLI cache directory exists
  file:
    path: "{{ wordfence_cache_dir }}"
    state: directory
    owner: "{{ wordfence_user }}"
    group: "{{ wordfence_user }}"
    mode: '0750'

- name: Ensure Wordfence CLI log directory exists
  file:
    path: "{{ wordfence_log_dir }}"
    state: directory
    owner: "{{ wordfence_user }}"
    group: "{{ wordfence_user }}"
    mode: '0750'

- name: Ensure Wordfence CLI lock directory exists
  file:
    path: "{{ wordfence_lock_dir }}"
    state: directory
    owner: "{{ wordfence_user }}"
    group: "{{ wordfence_user }}"
    mode: '0750'

- name: Write Wordfence CLI configuration file
  template:
    src: wordfence-cli.ini.j2
    dest: "{{ wordfence_config_file }}"
    owner: "{{ wordfence_user }}"
    group: "{{ wordfence_user }}"
    mode: '0640'

- name: Configure logrotate for Wordfence CLI logs
  template:
    src: wordfence-logrotate.j2
    dest: /etc/logrotate.d/wordfence
    owner: root
    group: root
    mode: '0644'
  when: wordfence_logrotate_enabled
